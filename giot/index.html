<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIỌT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#1D130E; --bg-2:#251A13; --card:#2E211A; --card-2:#382A21; --line:#4A382C;
  --cream:#F5EBDC; --cream-d:#CBB89F; --mut:#9C8873;
  --caramel:#E8A34C; --caramel-d:#B07425; --ice:#A8D3DE; --leaf:#8FB573; --hot:#E06A4A;
  --milk:#F3E3C3; --cf-1:#8A6242; --cf-2:#5E4129; --cf-3:#3A2417;
  --disp:"Bricolage Grotesque",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
::selection{background:var(--caramel);color:#241203}
html{background:#120B08}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--disp);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  max-width:480px;margin-inline:auto;min-height:100vh;position:relative;box-shadow:0 0 60px rgba(0,0,0,.55)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--caramel);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-size:12px}
.mut{color:var(--mut)}
.wrap{padding-inline:18px}

/* ---------- Đầu app ---------- */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg) 82%,transparent);padding:14px 18px 10px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
.logo i{display:inline-block;width:9px;height:12px;background:var(--caramel);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin-left:2px;transform:translateY(1px)}
.top .grow{flex:1}
.table-chip{font-family:var(--mono);font-size:12.5px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--cream-d)}
.table-chip b{color:var(--caramel)}
#btn-tray{position:relative;width:44px;height:44px;border-radius:14px;background:var(--caramel);color:#241203;display:grid;place-items:center;box-shadow:0 4px 0 var(--caramel-d);transition:transform .12s}
#btn-tray:active{transform:translateY(2px);box-shadow:0 2px 0 var(--caramel-d)}
#tray-n{position:absolute;top:-6px;right:-6px;min-width:21px;height:21px;border-radius:11px;background:var(--hot);color:#fff;font-family:var(--mono);font-size:11.5px;display:grid;place-items:center;padding-inline:5px;transition:transform .2s}
#tray-n.tick{transform:scale(1.35)}

/* ---------- Chào + hàng chờ ---------- */
.hello{padding:8px 18px 4px}
.hello h1{font-weight:800;font-size:clamp(26px,7.4vw,34px);letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
.hello h1 em{font-style:normal;color:var(--caramel)}
.queue{display:flex;align-items:center;gap:10px;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--mut)}
.queue .drops{display:flex;gap:5px}
.queue .drops i{width:7px;height:10px;background:var(--cf-1);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:.9}
@media (prefers-reduced-motion:no-preference){
  .queue .drops i{animation:qdrop 1.6s ease-in-out infinite}
  .queue .drops i:nth-child(2){animation-delay:.28s}.queue .drops i:nth-child(3){animation-delay:.56s}
  @keyframes qdrop{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(4px);opacity:1}}
}

/* ---------- Menu ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 6px;position:sticky;top:64px;z-index:25;background:var(--bg);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-weight:700;font-size:13.5px;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);color:var(--cream-d);background:var(--bg-2)}
.tab[aria-pressed="true"]{background:var(--cream);color:#241203;border-color:var(--cream)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 18px 28px}
.mi{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .15s,border-color .15s;position:relative}
.mi:active{transform:scale(.97)}
.mi:hover{border-color:var(--caramel)}
.mi svg{height:96px;width:auto;margin-inline:auto}
.mi .nm{font-weight:700;font-size:14.5px;line-height:1.2}
.mi .de{font-size:11.5px;color:var(--mut);line-height:1.4;flex:1}
.mi .pr{font-family:var(--mono);font-size:13.5px;color:var(--caramel)}
.mi .hot-tag{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:10px;background:var(--hot);color:#fff;border-radius:6px;padding:2px 7px}
.sec-note{padding:0 18px 20px;font-family:var(--mono);font-size:11.5px;color:var(--mut)}

/* ---------- Sheet pha ly ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,6,4,.66);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;max-width:480px;margin-inline:auto}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:480px;margin-inline:auto;background:var(--bg-2);border-radius:26px 26px 0 0;border:1.5px solid var(--line);border-bottom:0;
  transform:translateY(104%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:92dvh;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet-grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 2px}
.sheet-scroll{overflow-y:auto;padding:6px 18px calc(140px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;gap:14px;align-items:flex-start}
.sheet-head h2{font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.sheet-head .de{font-size:12.5px;color:var(--mut);margin-top:4px}
.sheet-close{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mut);flex:none;padding:4px}
.glass-stage{display:grid;place-items:center;padding:10px 0 4px;position:relative}
.glass-stage svg{height:210px;width:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.glass-cap{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:center;min-height:1.3em}
.opt{margin-top:16px}
.opt h4{font-family:var(--mono);font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.segs{display:flex;gap:8px;flex-wrap:wrap}
.seg{font-weight:700;font-size:13.5px;border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;background:var(--card);color:var(--cream-d);transition:transform .1s}
.seg:active{transform:scale(.95)}
.seg small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--mut)}
.seg[aria-pressed="true"]{background:var(--cream);color:#241203;border-color:var(--cream)}
.seg[aria-pressed="true"] small{color:#6E4F2C}
.sheet-foot{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg-2) 26%);padding:18px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;border-radius:0 0 0 0}
.qty{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.qty button{width:40px;height:46px;font-weight:800;font-size:18px}
.qty span{width:36px;display:grid;place-items:center;font-family:var(--mono);font-size:15px}
.cta{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:15px;background:var(--caramel);color:#241203;padding:14px 18px;border-radius:14px;box-shadow:0 4px 0 var(--caramel-d);transition:transform .12s}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 var(--caramel-d)}
.cta .mono{color:#5C3A10;font-size:13px}
/* ---------- Khay (giỏ) ---------- */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:52;max-width:480px;margin-inline:auto;background:var(--bg-2);border-radius:26px 26px 0 0;border:1.5px solid var(--line);border-bottom:0;
  transform:translateY(104%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:92dvh;display:flex;flex-direction:column}
.tray.on{transform:none}
.tray-h{display:flex;align-items:baseline;gap:10px;padding:18px 18px 8px}
.tray-h h2{font-weight:800;font-size:21px}
.tray-h .mono{color:var(--mut)}
.tray-h button{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mut)}
.tray-list{overflow-y:auto;padding:0 18px;flex:1}
.ti{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.ti svg{height:62px;width:auto;margin-inline:auto}
.ti .nm{font-weight:700;font-size:14.5px;line-height:1.25}
.ti .cfg{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:3px;line-height:1.5}
.ti .note-line{font-family:var(--mono);font-size:11px;color:var(--ice);margin-top:2px}
.ti .r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ti .pr{font-family:var(--mono);font-size:13px;color:var(--caramel)}
.mini-qty{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px}
.mini-qty button{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);font-weight:800;display:grid;place-items:center}
.ti .note-btn{font-family:var(--mono);font-size:10.5px;color:var(--mut);text-decoration:underline}
.tray-foot{padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line)}
.trow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--cream-d);padding-block:3px}
.trow.total{font-family:var(--disp);font-weight:800;font-size:18px;color:var(--cream)}
.tray-empty{padding:40px 18px;text-align:center;color:var(--mut)}
.tray-empty svg{height:90px;margin:0 auto 12px;opacity:.7}
.fld{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.fld label{font-family:var(--mono);font-size:11px;color:var(--mut)}
.fld input,.fld textarea{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;color:var(--cream)}
.fld input:focus,.fld textarea:focus{border-color:var(--caramel);outline:none}
.err{font-family:var(--mono);font-size:12px;color:var(--hot);min-height:1.3em;margin-top:6px}
.pay-note{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:center;margin-top:9px}

/* ---------- Theo dõi đơn: phin nhỏ giọt ---------- */
.track{padding:6px 18px 40px}
.ticket{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;position:relative;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line)}
.ticket::before{left:-13px}.ticket::after{right:-13px}
.tk-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px dashed var(--line);padding-bottom:10px}
.tk-head b{font-weight:800;font-size:17px}
.tk-head .mono{color:var(--mut)}
.tk-items{padding-block:8px;border-bottom:1.5px dashed var(--line)}
.tk-items .trow{color:var(--cream)}
.tk-items .cfg{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin:-2px 0 4px}
.phin-stage{display:grid;place-items:center;padding:16px 0 6px}
.phin-stage svg{height:240px;width:auto}
.drip{transform-origin:center top}
@media (prefers-reduced-motion:no-preference){
  .drip{animation:drip 1.1s cubic-bezier(.55,0,.9,.6) infinite}
  @keyframes drip{0%{transform:translateY(0) scaleY(.4);opacity:0}14%{opacity:1;transform:translateY(2px) scaleY(1)}
    80%{transform:translateY(64px)}100%{transform:translateY(66px);opacity:0}}
  .steam path{animation:steam 3.4s ease-in-out infinite}
  .steam path:nth-child(2){animation-delay:1.1s}
  @keyframes steam{0%{transform:translateY(6px);opacity:0}35%{opacity:.7}100%{transform:translateY(-14px);opacity:0}}
}
.status-line{text-align:center;margin-top:6px}
.status-line b{font-weight:800;font-size:19px;display:block}
.status-line .mono{color:var(--mut);margin-top:4px;display:block}
.status-line .cnt{font-family:var(--mono);font-size:13px;color:var(--caramel)}
.steps{display:flex;gap:6px;margin-top:16px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.steps i.on{background:var(--caramel)}
.steps i.run::after{content:"";position:absolute;inset:0;background:var(--caramel);transform-origin:left;animation:none}
.call-row{display:flex;gap:10px;margin-top:18px}
.ghost-btn{flex:1;text-align:center;font-weight:700;font-size:14px;border:1.5px solid var(--line);border-radius:14px;padding:13px;color:var(--cream-d)}
.ghost-btn:hover{border-color:var(--cream-d)}
.done-note{margin-top:14px;background:var(--card-2);border:1.5px dashed var(--leaf);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--cream-d)}
.done-note b{color:var(--leaf)}

footer.app{padding:26px 18px calc(20px + env(safe-area-inset-bottom,0px));color:var(--mut);font-family:var(--mono);font-size:11px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);margin-top:10px}
.view{animation:vin .3s ease}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.mi,.seg,.cta,#btn-tray{transition:none}}
</style>
</head>
<body>
<div class="top">
  <span class="logo">GIỌT<i aria-hidden="true"></i></span>
  <div class="grow"></div>
  <button class="table-chip" id="table-chip" aria-label="Đổi số bàn">bàn <b id="table-n">7</b> ▾</button>
  <button id="btn-tray" aria-label="Mở khay đồ uống">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10 h13 v5 a6 6 0 0 1 -12 0 z"/><path d="M17 11 h2 a2.4 2.4 0 0 1 0 5 h-2"/><path d="M7 6 q1 -1.6 0 -3 M11 6 q1 -1.6 0 -3"/></svg>
    <span id="tray-n" hidden>0</span>
  </button>
</div>

<main id="app">
  <!-- MENU -->
  <section class="view" id="view-menu">
    <div class="hello">
      <h1>Chiều nay uống gì,<br>để <em>Giọt</em> pha cho?</h1>
      <div class="queue"><span class="drops" aria-hidden="true"><i></i><i></i><i></i></span><span id="queue-line"></span></div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="menu" id="menu"></div>
    <p class="sec-note">Giá đã gồm VAT · gọi xong trả ở quầy, tiền mặt hay quét mã đều được.</p>
  </section>
  <!-- THEO DÕI -->
  <section class="view" id="view-track" hidden></section>
</main>

<footer class="app">
  <span>GIỌT — cà phê phin, 34 Cống Quỳnh. Mở 6h30–22h30.</span>
  <span>Trang dựng ý tưởng, quán không có thật — đơn không tới quầy nào đâu.</span>
</footer>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Pha ly của bạn"></div>
<div class="tray" id="tray" role="dialog" aria-modal="true" aria-label="Khay của bạn"></div>

<script>
"use strict";
/* ---------- Thực đơn ---------- */
const VND=n=>n.toLocaleString("vi-VN")+"đ";
const CATS=[["all","Tất cả"],["phin","Cà phê phin"],["khac","Không cà phê"],["banh","Bánh"]];
// mods: temp (đá/nóng), strength (cữ phin), sweet (lớp sữa/đường), ice, top (topping)
const MENU=[
 {id:"d1",cat:"phin",name:"Đen phin",de:"phin truyền thống, đắng sạch, hậu ngọt",price:29000,base:"coffee",mods:["temp","strength","sweet0","ice"],hot:false},
 {id:"d2",cat:"phin",name:"Sữa đá",de:"phin đậm gặp sữa đặc, món đinh của quán",price:35000,base:"coffee",milk:1,mods:["temp","strength","sweet","ice"],best:1},
 {id:"d3",cat:"phin",name:"Bạc xỉu",de:"nhiều sữa ít cà phê, ngọt dịu dễ uống",price:39000,base:"coffee",milk:2,mods:["temp","strength","sweet","ice"]},
 {id:"d4",cat:"phin",name:"Cà phê muối",de:"kem muối béo mặn phủ trên phin đậm",price:45000,base:"coffee",milk:1,foam:1,mods:["temp","strength","ice"]},
 {id:"d5",cat:"phin",name:"Cốt dừa cà phê",de:"cốt dừa xay mịn, thơm như chè bà ba",price:49000,base:"coffee",milk:2,coco:1,mods:["strength","ice"],iced:1},
 {id:"k1",cat:"khac",name:"Sữa chua cà phê",de:"chua nhẹ, lạ miệng, uống là tỉnh",price:45000,base:"yogurt",milk:2,mods:["ice","sweet"],iced:1},
 {id:"k2",cat:"khac",name:"Cacao nóng",de:"cacao Bà Rịa pha đặc, ấm bụng",price:42000,base:"cacao",milk:1,mods:["sweet"],hotOnly:1},
 {id:"k3",cat:"khac",name:"Trà đào cam sả",de:"đào ngâm nhà làm, sả đập dập",price:45000,base:"peach",mods:["ice","sweet"],iced:1},
 {id:"k4",cat:"khac",name:"Trà lài mận Hà Nội",de:"trà lài ướp tay, mận dầm chua ngọt",price:42000,base:"plum",mods:["ice","sweet"],iced:1},
 {id:"k5",cat:"khac",name:"Soda chanh sả",de:"chanh tươi, sả, soda lạnh buốt",price:39000,base:"soda",mods:["ice","sweet"],iced:1},
 {id:"b1",cat:"banh",name:"Flan cà phê",de:"flan trứng rưới nước phin, lạnh mềm",price:25000,plate:"flan"},
 {id:"b2",cat:"banh",name:"Croissant bơ",de:"nướng lại tại quầy, giòn vỏ",price:32000,plate:"croissant"},
 {id:"b3",cat:"banh",name:"Bánh chuối nướng",de:"chuối sứ, nước dừa, ăn ấm",price:30000,plate:"banana"},
];
const TOPS=[["thach","thạch cà phê",7000],["kem","kem muối",10000],["shot","thêm 1 phin",8000]];
const BASE={coffee:["#8A6242","#5E4129","#31200F"],yogurt:["#F0E6D2","#EAD9BC","#E2CCA4"],cacao:["#7A4E33","#5E3A24","#462817"],
  peach:["#F2B04C","#E8923B","#D97C2E"],plum:["#D95C4A","#C24238","#A93630"],soda:["#CFE8CF","#AEDBB4","#8FCB9B"]};
const STR=[["nhẹ","cữ nhẹ","uống cả chiều"],["vừa","cữ vừa","chuẩn quán"],["đậm","cữ đậm","tỉnh tới tối"]];
const SWE=[["0","không ngọt",""],["50","ít ngọt","bớt nửa sữa"],["100","ngọt bùi","đúng công thức"]];
const ICE=[["it","ít đá","đỡ loãng"],["vua","đá vừa",""],["nhieu","nhiều đá","mát họng"]];

/* ---------- Vẽ ly ---------- */
function glassSVG(item,cfg,h){
  h=h||120; cfg=cfg||defCfg(item);
  if(item.plate) return plateSVG(item,h);
  const hot=cfg.temp==="nóng";
  const W=160,HH=220;
  const strI={"nhẹ":0,"vừa":1,"đậm":2}[cfg.strength||"vừa"];
  let cof=BASE[item.base][strI];
  if(cfg.tops&&cfg.tops.shot) cof=BASE[item.base][2];
  const milkH={0:0,50:1,100:2}[+cfg.sweet]??1;
  const milkPx=item.milk? [0,20,34][milkH]*(item.milk===2?1.5:1) : (item.base!=="coffee"&&item.base!=="cacao"? [0,8,14][milkH]:0);
  const milkCol=item.coco?"#F7F1E3":item.base==="soda"?"#E9F5E4":item.base==="peach"?"#F8D8A0":item.base==="plum"?"#EFB0A4":"#F3E3C3";
  // thân ly / tách
  let inner="";
  const gx=44,gw=72,gy=hot?70:34,gh=hot?96:150,gb=gy+gh;
  // lớp: sữa đáy → cà phê → (thạch) → đá → kem muối
  let y=gb;
  if(milkPx>0){y-=milkPx;inner+=`<rect x="${gx}" y="${y}" width="${gw}" height="${milkPx}" fill="${milkCol}"/>`;}
  const cofH=y-gy-(item.foam||cfg.tops&&cfg.tops.kem?18:6);
  inner+=`<rect x="${gx}" y="${gy+((item.foam||cfg.tops&&cfg.tops.kem)?18:6)}" width="${gw}" height="${cofH}" fill="${cof}"/>`;
  if(cfg.tops&&cfg.tops.thach){for(let i=0;i<5;i++)inner+=`<rect x="${gx+6+(i%3)*22}" y="${gb-12-((i/3)|0)*13}" width="14" height="9" rx="2.5" fill="#2A1508" stroke="#120A05" stroke-width="1.5"/>`;}
  if(!hot&&cfg.ice!=="khong"){
    const n={it:2,vua:4,nhieu:6}[cfg.ice||"vua"]||4;
    for(let i=0;i<n;i++){const ix=gx+8+(i%2)*34+((i*13)%9),iy=gy+16+((i/2)|0)*30;
      inner+=`<rect x="${ix}" y="${iy}" width="22" height="22" rx="5" transform="rotate(${(i*17)%28-14} ${ix+11} ${iy+11})" fill="rgba(200,232,240,.42)" stroke="#A8D3DE" stroke-width="2"/>`;}}
  if(item.foam||cfg.tops&&cfg.tops.kem)inner+=`<rect x="${gx}" y="${gy+4}" width="${gw}" height="16" rx="7" fill="#F6EBD4"/><circle cx="${gx+16}" cy="${gy+6}" r="2" fill="#E8D9B8"/><circle cx="${gx+38}" cy="${gy+4}" r="2.4" fill="#E8D9B8"/><circle cx="${gx+58}" cy="${gy+7}" r="2" fill="#E8D9B8"/>`;
  const clip=hot?`<path d="M${gx-4} ${gy} h${gw+8} l-7 ${gh} h-${gw-6} Z"/>`:`<path d="M${gx-4} ${gy} h${gw+8} l-6 ${gh+2} q-1 8 -9 8 h-${gw-20} q-8 0 -9 -8 Z"/>`;
  const shell=hot?
    `<ellipse cx="80" cy="${gb+14}" rx="52" ry="8" fill="#161009"/><path d="M${gx-4} ${gy} h${gw+8} l-7 ${gh} h-${gw-6} Z" fill="none" stroke="#120A05" stroke-width="4"/>
     <path d="M${gx+gw+4} ${gy+18} h10 a16 16 0 0 1 0 34 h-14" fill="none" stroke="#120A05" stroke-width="4"/>
     <g class="steam" stroke="#CBB89F" stroke-width="3" fill="none" opacity=".8"><path d="M66 52 q6 -12 -2 -22"/><path d="M92 54 q7 -13 -1 -24"/></g>`:
    `<path d="M${gx-4} ${gy} h${gw+8} l-6 ${gh+2} q-1 8 -9 8 h-${gw-20} q-8 0 -9 -8 Z" fill="none" stroke="#120A05" stroke-width="4"/>
     <line x1="${gx+gw-12}" y1="16" x2="${gx+26}" y2="${gy+26}" stroke="#E8A34C" stroke-width="6" stroke-linecap="round"/>
     <line x1="${gx-4}" y1="${gy+26}" x2="${gx+gw+4}" y2="${gy+26}" stroke="rgba(255,255,255,.16)" stroke-width="3"/>`;
  return `<svg viewBox="0 0 ${W} ${HH}" style="height:${h}px" fill="none" aria-hidden="true">
    <defs><clipPath id="cl-${item.id}-${h}">${clip}</clipPath></defs>
    <rect x="${gx-4}" y="${gy}" width="${gw+8}" height="${gh+10}" rx="8" fill="rgba(255,255,255,.05)"/>
    <g clip-path="url(#cl-${item.id}-${h})">${inner}</g>${shell}</svg>`;
}
function plateSVG(item,h){
  const shapes={
    flan:`<path d="M52 96 h56 l-8 -34 h-40 Z" fill="#F2C878" stroke="#120A05" stroke-width="4"/><path d="M60 62 h40 q4 10 -4 12 q-14 5 -32 0 q-8 -2 -4 -12" fill="#8A5A2B" stroke="#120A05" stroke-width="3"/>`,
    croissant:`<path d="M44 92 q-10 -26 18 -34 q18 -6 36 0 q28 8 18 34 q-8 -12 -18 -14 q4 10 -6 14 q-6 -12 -12 -13 q-6 1 -12 13 q-10 -4 -6 -14 q-10 2 -18 14 Z" fill="#DFA050" stroke="#120A05" stroke-width="4"/>`,
    banana:`<rect x="48" y="60" width="64" height="36" rx="7" fill="#C98A3E" stroke="#120A05" stroke-width="4"/><circle cx="68" cy="78" r="6" fill="#F2DCA8" stroke="#120A05" stroke-width="2.5"/><circle cx="92" cy="78" r="6" fill="#F2DCA8" stroke="#120A05" stroke-width="2.5"/>`};
  return `<svg viewBox="0 0 160 220" style="height:${h}px" fill="none" aria-hidden="true">
    <g transform="translate(0 55)">${shapes[item.plate]}<ellipse cx="80" cy="104" rx="58" ry="10" fill="none" stroke="#120A05" stroke-width="4"/><ellipse cx="80" cy="104" rx="40" ry="5.5" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2.5"/></g></svg>`;
}
function defCfg(item){
  return item.plate?{}:{temp:item.hotOnly?"nóng":"đá",strength:"vừa",sweet:item.mods&&item.mods.includes("sweet0")?"0":"100",ice:"vua",tops:{}};
}
/* ---------- Trạng thái ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const state={cat:"all",table:7,tray:[],sel:null,order:null,timer:null};
try{const t=JSON.parse(localStorage.getItem("giot-tray")||"null");if(t&&Array.isArray(t.items)){state.tray=t.items;state.table=t.table||7;}}catch{}
const save=()=>{try{localStorage.setItem("giot-tray",JSON.stringify({items:state.tray,table:state.table}));}catch{}};
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const byId=id=>MENU.find(m=>m.id===id);
function priceOf(it){
  const m=byId(it.id); let p=m.price;
  if(it.size==="M")p+=6000;
  if(it.cfg&&it.cfg.tops)for(const[k,,pr]of TOPS)if(it.cfg.tops[k])p+=pr;
  return p*it.q;
}
function cfgText(it){
  const m=byId(it.id); if(m.plate)return it.size==="M"?"phần lớn":"";
  const c=it.cfg,bits=[];
  bits.push(it.size==="M"?"ly lớn":"ly vừa");
  if(m.mods.includes("temp")||m.hotOnly||m.iced)bits.push(c.temp);
  if(m.mods.includes("strength"))bits.push("cữ "+c.strength);
  if(m.mods.includes("sweet")||m.mods.includes("sweet0"))bits.push(SWE.find(s=>s[0]===String(c.sweet))[1]);
  if(c.temp!=="nóng"&&(m.mods.includes("ice")))bits.push(ICE.find(i=>i[0]===c.ice)[1]);
  for(const[k,n]of TOPS)if(c.tops&&c.tops[k])bits.push("+"+n);
  return bits.join(" · ");
}

function seg(list,cur,attr){return list.map(([v,n,d])=>`<button class="seg" data-${attr}="${v}" aria-pressed="${String(cur)===String(v)}">${n}${d?`<small>${d}</small>`:""}</button>`).join("");}
function renderSheet(){

    <div class="opt"><h4>Cỡ</h4><div class="segs">

    ${!m.plate&&(m.mods.includes("temp"))?`<div class="opt"><h4>Nóng / đá</h4><div class="segs">${seg([["đá","Đá",""],["nóng","Nóng","tách sứ + phin"]],c.temp,"temp")}</div></div>`:""}
    ${!m.plate&&m.mods.includes("strength")?`<div class="opt"><h4>Cữ phin</h4><div class="segs">${seg(STR,c.strength,"str")}</div></div>`:""}
    ${!m.plate&&(m.mods.includes("sweet")||m.mods.includes("sweet0"))?`<div class="opt"><h4>Độ ngọt</h4><div class="segs">${seg(SWE,c.sweet,"swe")}</div></div>`:""}
    ${!m.plate&&m.mods.includes("ice")&&c.temp!=="nóng"?`<div class="opt"><h4>Đá</h4><div class="segs">${seg(ICE,c.ice,"ice")}</div></div>`:""}
    ${!m.plate?`<div class="opt"><h4>Thêm cho vui</h4><div class="segs">${TOPS.map(([k,n,p])=>`<button class="seg" data-top="${k}" aria-pressed="${!!c.tops[k]}">${n}<small>+${VND(p)}</small></button>`).join("")}</div></div>`:""}
  </div>
  <div class="sheet-foot">
    <div class="qty"><button id="q-m" aria-label="Bớt">−</button><span id="q-v">${s.q}</span><button id="q-p" aria-label="Thêm">+</button></div>

  </div>`;
  $("#sheet-close").addEventListener("click",closeSheet);
  const re=()=>{renderSheet();};
  $$("#sheet [data-size]").forEach(b=>b.addEventListener("click",()=>{s.size=b.dataset.size;re();}));
  $$("#sheet [data-temp]").forEach(b=>b.addEventListener("click",()=>{c.temp=b.dataset.temp;re();}));
  $$("#sheet [data-str]").forEach(b=>b.addEventListener("click",()=>{c.strength=b.dataset.str;re();}));
  $$("#sheet [data-swe]").forEach(b=>b.addEventListener("click",()=>{c.sweet=b.dataset.swe;re();}));
  $$("#sheet [data-ice]").forEach(b=>b.addEventListener("click",()=>{c.ice=b.dataset.ice;re();}));
  $$("#sheet [data-top]").forEach(b=>b.addEventListener("click",()=>{c.tops[b.dataset.top]=!c.tops[b.dataset.top];re();}));
  $("#q-m").addEventListener("click",()=>{s.q=Math.max(1,s.q-1);$("#q-v").textContent=s.q;$("#add-p").textContent=VND(priceOf(s));});
  $("#q-p").addEventListener("click",()=>{s.q=Math.min(10,s.q+1);$("#q-v").textContent=s.q;$("#add-p").textContent=VND(priceOf(s));});
  $("#add").addEventListener("click",()=>{
    const same=state.tray.find(t=>t.id===s.id&&t.size===s.size&&JSON.stringify(t.cfg)===JSON.stringify(s.cfg));
    if(same)same.q+=s.q;else state.tray.push({id:s.id,size:s.size,q:s.q,cfg:JSON.parse(JSON.stringify(s.cfg)),note:""});
    save();badge(true);closeSheet();setTimeout(openTray,240);
  });
}
/* ---------- Khay ---------- */
const trayCount=()=>state.tray.reduce((a,i)=>a+i.q,0);
const trayTotal=()=>state.tray.reduce((a,i)=>a+priceOf(i),0);
function badge(tick){

/* ---------- Gửi quầy & phin nhỏ giọt ---------- */
function sendOrder(){
  if(!(state.name||"").trim()){$("#tray-err").textContent="Cho quầy xin tên để lát gọi món nghe.";$("#f-name").focus();return;}
  const items=state.tray.map(it=>({...it}));
  const code="G"+String(Math.floor(Math.random()*900)+100);
  state.order={code,items,table:state.table,name:state.name.trim(),total:trayTotal(),t0:Date.now(),
    brewMs:(20+8*(trayCount()-1))*1000,stage:0,drops:0};
  state.tray=[];save();badge();closeTray();
  showTrack();
}

  $("#view-menu").hidden=true;$("#view-track").hidden=false;window.scrollTo(0,0);

function tickOrder(){
  const o=state.order;if(!o)return;

  if(stage===1)o.drops=Math.min(999,Math.floor((el-accept)/550)+1);
  const fill=stage<1?0:stage>1?1:Math.min(1,(el-accept)/brew);
  const leftS=Math.max(0,Math.ceil((accept+brew-el)/1000))*ACC;
  const st=[["Quầy đã thấy đơn","anh pha chế đang tráng phin nước sôi…"],

    ["Xong rồi — "+o.name+" ơi!","bạn Nam đang bưng ra bàn "+o.table+", hoặc ra quầy lấy cho lẹ"]][stage];
  if(stage===2&&o.stage!==2){clearInterval(state.timer);state.timer=setInterval(tickOrder,4000);}
  o.stage=stage;
  $("#view-track").innerHTML=`<div class="track">
    <div class="hello"><h1>${stage===2?"Món của bạn <em>xong rồi.</em>":"Quầy nhận đơn <em>bàn "+o.table+"</em> rồi nè."}</h1></div>

      <div class="tk-items">${o.items.map(it=>{const m=byId(it.id);return `<div class="trow"><span>${it.q}× ${m.name}</span><span>${VND(priceOf(it))}</span></div><p class="cfg">${cfgText(it)}${it.note?" · ✎ "+it.note:""}</p>`;}).join("")}</div>
      <div class="trow total" style="padding-top:9px"><span>Trả ở quầy</span><span>${VND(o.total)}</span></div>
      <div class="phin-stage">${phinSVG(fill,stage===2)}</div>
      <div class="status-line"><b>${st[0]}</b><span class="mono">${st[1]}</span>
        ${stage===1?`<span class="cnt">còn khoảng ${leftS} giây (giờ quán) · thanh chạy nhanh ×${ACC} cho bản demo</span>`:""}</div>
      <div class="steps">${[0,1,2].map(i=>`<i class="${i<stage?"on":i===stage?"on":""}" style="${i===stage&&stage<2?"opacity:.55":""}"></i>`).join("")}</div>
    </div>
    ${stage===2?`<div class="done-note"><b>Mẹo của quán:</b> khuấy đáy ly hai vòng trước khi uống — sữa đặc nằm hết ở dưới đó.</div>`:""}
    <div class="call-row">
      <button class="ghost-btn" id="more">Gọi thêm món</button>
      ${stage===2?`<button class="ghost-btn" id="fin" style="border-color:var(--leaf);color:var(--leaf)">Xong, cảm ơn quán</button>`:""}
    </div></div>`;
  $("#more").addEventListener("click",backToMenu);
  const f=$("#fin");if(f)f.addEventListener("click",()=>{clearInterval(state.timer);state.order=null;backToMenu();});
}

/* ---------- Khởi động ---------- */
renderTabs();renderMenu();renderQueue();badge();
const hm=location.hash.match(/^#ban-(\d{1,2})$/);
if(hm){state.table=Math.min(12,Math.max(1,+hm[1]));$("#table-n").textContent=state.table;}
else $("#table-n").textContent=state.table;
</script>
</body>
</html>
